<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ALSHAMI System Designer</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .logo {
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .logo-line {
      width: 70px;
      height: 3px;
      margin: 0 auto 15px;
      background: #222;
      border-radius: 5px;
    }

    .system-name {
      font-size: 18px;
      font-weight: bold;
      color: #555;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .input-title {
      display: block;
      text-align: right;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #333;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
      min-height: 20px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <div class="logo">
      ALSHAMI
    </div>

    <div class="logo-line"></div>

    <div class="system-name">
      SYSTEM DESIGNER
    </div>


    <label class="input-title">
      اسم المستخدم
    </label>

    <input
      type="text"
      id="username"
      placeholder="أدخل اسم المستخدم"
    >


    <label class="input-title">
      كلمة المرور
    </label>

    <input
      type="password"
      id="password"
      placeholder="أدخل كلمة المرور"
      onkeydown="checkEnter(event)"
    >


    <button onclick="login()">
      تسجيل الدخول
    </button>


    <div id="message"></div>


    <div class="footer">
      ALSHAMI © 2026
    </div>

  </div>


  <script>

    function login() {

      let username =
        document.getElementById("username").value;

      let password =
        document.getElementById("password").value;


      if (username === "admin" && password === "1234") {

        document.getElementById("message").innerText =
          "تم تسجيل الدخول بنجاح";


        setTimeout(function() {

          window.location.href = "dashboard.html";

        }, 700);


      } else {

        document.getElementById("message").innerText =
          "اسم المستخدم أو كلمة المرور غير صحيحة";

      }

    }


    function checkEnter(event) {

      if (event.key === "Enter") {

        login();

      }

    }

  </script>

</body>

</html>
